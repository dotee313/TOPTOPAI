name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Add Android platform
        run: npx cap add android
      - name: Install in-app proxy router
        run: |
          DST=android/app/src/main/java/com/toptopai/app
          mkdir -p "$DST"
          cp android-native/MainActivity.java "$DST/MainActivity.java"
          cp android-native/ProxyRouterPlugin.java "$DST/ProxyRouterPlugin.java"
          cp android-native/ProxyWebViewClient.java "$DST/ProxyWebViewClient.java"
          cp android-native/ProxyRouterState.java "$DST/ProxyRouterState.java"
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'okhttp3' not in s:
              s += '\ndependencies {\n  implementation "com.squareup.okhttp3:okhttp:4.12.0"\n}\n'
          open(p, 'w').write(s)
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          open(p, 'w').write(s)
          PY
      - name: Generate icons and sync
        run: |
          npx --yes @capacitor/assets@3 generate --android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TOPTOPAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOPTOPAI-apk
          path: TOPTOPAI.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TOPTOPAI.apk --title "TOPTOPAI APK" --notes "OpenCode agent + in-app proxy router. Direct APK: https://github.com/dotee313/TOPTOPAI/releases/download/latest/TOPTOPAI.apk"
