name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TOPTOPAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOPTOPAI-apk
          path: TOPTOPAI.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TOPTOPAI.apk --title "TOPTOPAI APK" --notes "Latest build"
